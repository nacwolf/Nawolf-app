openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Kostr API - food manufacturer cost and margin tracking
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: ingredients
    description: Ingredient management
  - name: skus
    description: SKU management
  - name: dashboard
    description: Dashboard analytics
  - name: Storage
    description: Object storage upload and serving endpoints.

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /ingredients:
    get:
      operationId: listIngredients
      tags: [ingredients]
      summary: List all ingredients with current price
      responses:
        "200":
          description: List of ingredients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IngredientWithPrice"
    post:
      operationId: createIngredient
      tags: [ingredients]
      summary: Create a new ingredient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIngredientBody"
      responses:
        "201":
          description: Created ingredient
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ingredient"

  /ingredients/{id}:
    get:
      operationId: getIngredient
      tags: [ingredients]
      summary: Get ingredient by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Ingredient
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngredientWithPrice"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateIngredient
      tags: [ingredients]
      summary: Update ingredient fields
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateIngredientBody"
      responses:
        "200":
          description: Updated ingredient
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ingredient"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ingredients/{id}/price:
    post:
      operationId: updateIngredientPrice
      tags: [ingredients]
      summary: Update ingredient price — auto-recalculates affected SKUs
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateIngredientPriceBody"
      responses:
        "200":
          description: Updated price and recalculated SKUs count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateIngredientPriceResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ingredients/{id}/price-history:
    get:
      operationId: getIngredientPriceHistory
      tags: [ingredients]
      summary: Get price history for an ingredient
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Price history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IngredientPrice"

  /ingredients/{id}/attachments:
    get:
      operationId: listIngredientAttachments
      tags: [ingredients]
      summary: List attachments for an ingredient
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of attachments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IngredientAttachment"
    post:
      operationId: createIngredientAttachment
      tags: [ingredients]
      summary: Record a file attachment for an ingredient
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIngredientAttachmentBody"
      responses:
        "201":
          description: Created attachment record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngredientAttachment"

  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /storage/public-objects/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      summary: Serve a public asset
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content streamed.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: File not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content streamed.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /skus:
    get:
      operationId: listSkus
      tags: [skus]
      summary: List all SKUs with current margin status
      responses:
        "200":
          description: List of SKUs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SkuWithMargin"
    post:
      operationId: createSku
      tags: [skus]
      summary: Create a new SKU
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSkuBody"
      responses:
        "201":
          description: Created SKU
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkuWithMargin"

  /skus/{id}:
    get:
      operationId: getSku
      tags: [skus]
      summary: Get SKU detail with cost lines and snapshots
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: SKU detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkuDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateSku
      tags: [skus]
      summary: Update SKU sell price or other fields
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSkuBody"
      responses:
        "200":
          description: Updated SKU
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkuWithMargin"
        "404":
          description: Not found
    delete:
      operationId: deleteSku
      tags: [skus]
      summary: Delete a SKU
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /skus/{id}/cost-lines:
    get:
      operationId: getSkuCostLines
      tags: [skus]
      summary: Get cost lines for a SKU
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Cost lines
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CostLine"
    post:
      operationId: addSkuCostLine
      tags: [skus]
      summary: Add a cost line to a SKU
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddCostLineBody"
      responses:
        "201":
          description: Created cost line
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CostLine"

  /skus/{id}/cost-lines/{costLineId}:
    delete:
      operationId: deleteSkuCostLine
      tags: [skus]
      summary: Delete a cost line from a SKU
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: costLineId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /skus/{id}/snapshots:
    get:
      operationId: getSkuSnapshots
      tags: [skus]
      summary: Get historical snapshots for a SKU
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Snapshots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SkuSnapshot"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard KPI summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/margin-trends:
    get:
      operationId: getMarginTrends
      tags: [dashboard]
      summary: Get margin trend data for charts
      responses:
        "200":
          description: Margin trends
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MarginTrendPoint"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    Ingredient:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        category:
          type: string
        subCategory:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        unit:
          type: string
        supplier:
          type: ["string", "null"]
        priceTier1:
          type: ["number", "null"]
        priceTier1Description:
          type: ["string", "null"]
        priceTier2:
          type: ["number", "null"]
        priceTier2Description:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        createdBy:
          type: ["string", "null"]
        createdAt:
          type: string
      required:
        - id
        - name
        - category
        - unit
        - createdAt

    IngredientWithPrice:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        category:
          type: string
        subCategory:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        unit:
          type: string
        supplier:
          type: ["string", "null"]
        priceTier1:
          type: ["number", "null"]
        priceTier1Description:
          type: ["string", "null"]
        priceTier2:
          type: ["number", "null"]
        priceTier2Description:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        createdBy:
          type: ["string", "null"]
        createdAt:
          type: string
        currentPrice:
          type: ["number", "null"]
        priceEffectiveDate:
          type: ["string", "null"]
        skuCount:
          type: integer
        previousPrice:
          type: ["number", "null"]
        priceChangePct:
          type: ["number", "null"]
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/IngredientAttachment"
      required:
        - id
        - name
        - category
        - unit
        - createdAt
        - skuCount

    IngredientPrice:
      type: object
      properties:
        id:
          type: integer
        ingredientId:
          type: integer
        price:
          type: number
        effectiveDate:
          type: string
        reason:
          type: ["string", "null"]
        loggedBy:
          type: ["string", "null"]
        createdAt:
          type: string
      required:
        - id
        - ingredientId
        - price
        - effectiveDate
        - createdAt

    IngredientAttachment:
      type: object
      properties:
        id:
          type: integer
        ingredientId:
          type: integer
        fileName:
          type: string
        objectPath:
          type: string
        fileType:
          type: ["string", "null"]
        uploadedBy:
          type: ["string", "null"]
        uploadedAt:
          type: string
      required:
        - id
        - ingredientId
        - fileName
        - objectPath
        - uploadedAt

    CreateIngredientAttachmentBody:
      type: object
      properties:
        fileName:
          type: string
        objectPath:
          type: string
        fileType:
          type: ["string", "null"]
      required:
        - fileName
        - objectPath

    CreateIngredientBody:
      type: object
      properties:
        name:
          type: string
        category:
          type: string
        subCategory:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        unit:
          type: string
        supplier:
          type: ["string", "null"]
        initialPrice:
          type: ["number", "null"]
        priceTier1:
          type: ["number", "null"]
        priceTier1Description:
          type: ["string", "null"]
        priceTier2:
          type: ["number", "null"]
        priceTier2Description:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
      required:
        - name
        - category
        - unit

    UpdateIngredientBody:
      type: object
      properties:
        name:
          type: ["string", "null"]
        category:
          type: ["string", "null"]
        unit:
          type: ["string", "null"]
        subCategory:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        supplier:
          type: ["string", "null"]
        priceTier1:
          type: ["number", "null"]
        priceTier1Description:
          type: ["string", "null"]
        priceTier2:
          type: ["number", "null"]
        priceTier2Description:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]

    UpdateIngredientPriceBody:
      type: object
      properties:
        price:
          type: number
        effectiveDate:
          type: string
        reason:
          type: ["string", "null"]
      required:
        - price
        - effectiveDate

    UpdateIngredientPriceResponse:
      type: object
      properties:
        ingredientPrice:
          $ref: "#/components/schemas/IngredientPrice"
        affectedSkuCount:
          type: integer
      required:
        - ingredientPrice
        - affectedSkuCount

    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
        size:
          type: integer
          minimum: 1
        contentType:
          type: string
          minLength: 1

    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          format: uri
        objectPath:
          type: string

    Sku:
      type: object
      properties:
        id:
          type: integer
        skuCode:
          type: string
        name:
          type: string
        category:
          type: string
        unitSize:
          type: string
        sellPrice:
          type: number
        customerName:
          type: ["string", "null"]
        createdAt:
          type: string
      required:
        - id
        - skuCode
        - name
        - category
        - unitSize
        - sellPrice
        - createdAt

    SkuWithMargin:
      type: object
      properties:
        id:
          type: integer
        skuCode:
          type: string
        name:
          type: string
        category:
          type: string
        unitSize:
          type: string
        sellPrice:
          type: number
        customerName:
          type: ["string", "null"]
        createdAt:
          type: string
        totalCogs:
          type: ["number", "null"]
        grossMargin:
          type: ["number", "null"]
        status:
          type: string
          enum: [healthy, review, critical, unknown]
      required:
        - id
        - skuCode
        - name
        - category
        - unitSize
        - sellPrice
        - createdAt
        - status

    SkuDetail:
      type: object
      properties:
        id:
          type: integer
        skuCode:
          type: string
        name:
          type: string
        category:
          type: string
        unitSize:
          type: string
        sellPrice:
          type: number
        customerName:
          type: ["string", "null"]
        createdAt:
          type: string
        totalCogs:
          type: ["number", "null"]
        grossMargin:
          type: ["number", "null"]
        status:
          type: string
          enum: [healthy, review, critical, unknown]
        costLines:
          type: array
          items:
            $ref: "#/components/schemas/CostLine"
        snapshots:
          type: array
          items:
            $ref: "#/components/schemas/SkuSnapshot"
      required:
        - id
        - skuCode
        - name
        - category
        - unitSize
        - sellPrice
        - createdAt
        - status
        - costLines
        - snapshots

    CreateSkuBody:
      type: object
      properties:
        skuCode:
          type: string
        name:
          type: string
        category:
          type: string
        unitSize:
          type: string
        sellPrice:
          type: number
        customerName:
          type: ["string", "null"]
        costLines:
          type: array
          items:
            $ref: "#/components/schemas/AddCostLineBody"
      required:
        - skuCode
        - name
        - category
        - unitSize
        - sellPrice

    UpdateSkuBody:
      type: object
      properties:
        name:
          type: ["string", "null"]
        category:
          type: ["string", "null"]
        unitSize:
          type: ["string", "null"]
        sellPrice:
          type: ["number", "null"]
        customerName:
          type: ["string", "null"]

    CostLine:
      type: object
      properties:
        id:
          type: integer
        skuId:
          type: integer
        ingredientId:
          type: integer
        ingredientName:
          type: string
        ingredientUnit:
          type: string
        currentPrice:
          type: ["number", "null"]
        quantityPerUnit:
          type: number
        notes:
          type: ["string", "null"]
        lineCost:
          type: ["number", "null"]
      required:
        - id
        - skuId
        - ingredientId
        - ingredientName
        - ingredientUnit
        - quantityPerUnit

    AddCostLineBody:
      type: object
      properties:
        ingredientId:
          type: integer
        quantityPerUnit:
          type: number
        notes:
          type: ["string", "null"]
      required:
        - ingredientId
        - quantityPerUnit

    SkuSnapshot:
      type: object
      properties:
        id:
          type: integer
        skuId:
          type: integer
        snapshotDate:
          type: string
        totalCogs:
          type: number
        sellPrice:
          type: number
        grossMargin:
          type: number
        triggeredBy:
          type: ["string", "null"]
        createdAt:
          type: string
      required:
        - id
        - skuId
        - snapshotDate
        - totalCogs
        - sellPrice
        - grossMargin
        - createdAt

    DashboardSummary:
      type: object
      properties:
        totalSkus:
          type: integer
        healthyCount:
          type: integer
        reviewCount:
          type: integer
        criticalCount:
          type: integer
        unknownCount:
          type: integer
        avgMargin:
          type: ["number", "null"]
        totalIngredients:
          type: integer
        recentPriceChanges:
          type: integer
      required:
        - totalSkus
        - healthyCount
        - reviewCount
        - criticalCount
        - unknownCount
        - totalIngredients
        - recentPriceChanges

    MarginTrendPoint:
      type: object
      properties:
        date:
          type: string
        avgMargin:
          type: number
        healthyCount:
          type: integer
        reviewCount:
          type: integer
        criticalCount:
          type: integer
      required:
        - date
        - avgMargin
        - healthyCount
        - reviewCount
        - criticalCount
